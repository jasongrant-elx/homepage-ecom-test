<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLP test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&display=swap">
<style>
/* Mobile PLP rebuilt from the screenshot: full-bleed hero, chip filters, 2-col cards, inline promos, floating delivery bar. */
:root {
  color-scheme: light;
  --page: #e3e4e7;
  --card: #f3f4f5;
  --card-line: #ffffff;
  --navy: #0a2354;
  --ink-2: #67738b;
  --blue: #3a67b4;
  --blue-soft: #e9f6ff;
  --blue-line: #8fc0fc;
  --strike: #96acd4;
  --red: #bc250e;
  --sale: #e2453d;
  --green-bg: #cbe8d4;
  --green-line: #8cb99b;
  --green-ink: #1a3824;
  --star: #b88923;
  --klarna: #ffa8cd;
  --klarna-ink: #0a041c;
  --popular: #fbd488;
  --pill: rgba(247, 247, 248, .86);
  --tile: #e8e9ec;
  --plus: #dcdde2;
  --white: #ffffff;
  --shade: rgba(10, 35, 84, .08);
  --scrim: rgba(10, 18, 40, .42);
  --font: "Figtree", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  --r-card: 20px;
  --gut: 16px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--navy);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.3;
  letter-spacing: -.15px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
img { display: block; max-width: 100%; }
[hidden] { display: none !important; }
.wrap {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
}

/* ---------- header ---------- */
.hdr {
  position: absolute; inset: 0 0 auto; z-index: 30;
  color: var(--white);
  transition: background .25s, color .25s, box-shadow .25s;
}
.hdr.solid {
  position: fixed;
  top: 0;
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(243, 244, 245, .94);
  color: var(--navy);
  box-shadow: 0 1px 0 var(--shade);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.hdr-in { height: 60px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.hdr-left { display: flex; align-items: center; }
.hdr-right { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
.ibtn { width: 36px; height: 36px; display: grid; place-items: center; position: relative; border-radius: 50%; }
.ibtn svg { width: 26px; height: 26px; }
.ibtn.menu { margin-left: -6px; }
.ibtn.bag { margin-right: -4px; }
.logo {
  display: block; width: 128px; height: 33px;
  background: currentColor;
  -webkit-mask: var(--logo) center / contain no-repeat;
  mask: var(--logo) center / contain no-repeat;
}
.badge-count {
  position: absolute; top: 2px; right: 0;
  min-width: 17px; height: 17px; padding: 0 4px;
  border-radius: 9px; background: var(--sale); color: var(--white);
  font-size: 11px; font-weight: 600; line-height: 17px; text-align: center;
  transform: scale(0); transition: transform .2s;
}
.badge-count.on { transform: scale(1); }
.ibtn.liked svg path { fill: currentColor; }
.bump { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.22); } }

/* ---------- hero ---------- */
.hero {
  position: relative;
  height: 374px;
  background: var(--hero) center top / cover no-repeat, #b9b2aa;
}
.hero::after {
  content: ""; position: absolute; inset: auto 0 0; height: 120px;
  background: linear-gradient(to bottom, rgba(227, 228, 231, 0), rgba(227, 228, 231, .55) 55%, var(--page));
}
.hero .wrap { position: relative; height: 100%; }
.hero h1 {
  position: absolute; left: max(var(--gut), env(safe-area-inset-left, 0px)); bottom: 38px; z-index: 1;
  margin: 0; margin-left: 5px;
  color: var(--white);
  font-weight: 300; font-size: 45px; line-height: .94; letter-spacing: -.2px;
}
.pills {
  position: relative; z-index: 2;
  margin-top: -27px;
  display: flex; gap: 9px; overflow-x: auto; scrollbar-width: none;
  scroll-snap-type: x proximity;
  padding-top: 2px; padding-bottom: 4px;
}
.pills::-webkit-scrollbar { display: none; }
.pill {
  flex: none; height: 32px; padding: 0 12px;
  border-radius: 16px;
  background: var(--pill); border: 1px solid rgba(255, 255, 255, .9);
  color: var(--navy); font-size: 12.5px; letter-spacing: 0;
  white-space: nowrap; scroll-snap-align: start;
  transition: background .2s, color .2s, border-color .2s;
}
.pill[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: var(--white); }
.pill.sale[aria-pressed="true"] { background: var(--sale); border-color: var(--sale); }
.pill:active { transform: scale(.97); }

/* ---------- toolbar ---------- */
.bar { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
.count { font-size: 12.5px; flex: 1; font-variant-numeric: tabular-nums; }
.sort-lbl { font-size: 12.5px; margin-right: 1px; }
.sort { position: relative; }
.sort-btn {
  height: 32px; padding: 0 11px 0 12px;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 16px; background: #f7f7f8; border: 1px solid var(--white);
  font-size: 12.5px;
}
.sort-btn svg { width: 14px; height: 14px; transition: transform .2s; }
.sort.open .sort-btn svg { transform: rotate(180deg); }
.sort-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 20;
  min-width: 200px; padding: 6px;
  background: var(--white); border-radius: 14px;
  box-shadow: 0 10px 30px rgba(10, 35, 84, .16);
  list-style: none; margin: 0;
}
.sort-menu button {
  width: 100%; text-align: left; padding: 10px 12px; border-radius: 9px; font-size: 14px;
  display: flex; justify-content: space-between; align-items: center;
}
.sort-menu button:hover { background: var(--card); }
.sort-menu button[aria-checked="true"] { font-weight: 600; }
.sort-menu button[aria-checked="true"]::after { content: "✓"; color: var(--blue); }
.view-btn {
  width: 34px; height: 34px; margin-left: 3px;
  display: grid; place-items: center;
  border-radius: 50%; background: #f7f7f8; border: 1px solid var(--white);
}
.view-btn svg { width: 20px; height: 20px; }

/* ---------- grid ---------- */
.grid {
  margin-top: 16px;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px 8px;
  padding-bottom: 104px;
}
.span { grid-column: 1 / -1; }
.promo-pair { display: grid; gap: 22px; margin: 6px 0; }

.card {
  position: relative; min-width: 0;
  display: flex; flex-direction: column;
  padding: 0 12px 17px;
  background: linear-gradient(to bottom, var(--card) 60%, #f6f6f7);
  border: 1px solid var(--card-line);
  border-radius: var(--r-card);
  box-shadow: 0 1px 2px rgba(10, 35, 84, .04);
  cursor: pointer;
  animation: rise .35s ease both;
}
@keyframes rise { from { transform: translateY(8px); opacity: .4; } }
.media { position: relative; margin: 0 -12px; }
.slides {
  display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
  border-radius: var(--r-card) var(--r-card) 0 0;
}
.slides::-webkit-scrollbar { display: none; }
.slide {
  flex: none; width: 100%; height: 160px; scroll-snap-align: center;
  display: flex; align-items: flex-end; justify-content: flex-start;
  padding: 0 0 7px 32px; overflow: hidden;
}
.slide img { width: 97px; height: 145px; object-fit: contain; transition: opacity .25s; }
.slide.flip img { transform: scaleX(-1); }
.slide.zoom img { transform: scale(1.7) translateY(18%); transform-origin: 50% 0; }
.swatches {
  position: absolute; top: 55px; right: 11px;
  display: flex; flex-direction: column; gap: 6px;
}
.sw {
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid transparent; background: transparent;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .9);
  transition: border-color .15s;
}
.sw::before { content: ""; width: 22px; height: 22px; border-radius: 50%; background: var(--c); box-shadow: inset 0 -3px 5px rgba(0, 0, 0, .18), 0 0 0 1px rgba(0, 0, 0, .08); }
.sw[aria-checked="true"] { border-color: #111111; border-width: 1.5px; }
.dots { display: flex; justify-content: center; gap: 4px; margin: 1px 0 0; height: 10px; align-items: center; }
.dot { width: 4px; height: 4px; border-radius: 50%; background: #9a9a9a; transition: transform .2s, background .2s; }
.dot.on { background: #6a6a6a; transform: scale(1.3); }

.info { display: flex; flex-direction: column; min-width: 0; }
.tag-top {
  align-self: flex-start;
  margin-top: 10px; height: 21px; padding: 0 8px;
  display: inline-flex; align-items: center;
  border-radius: 11px; background: var(--green-bg); border: 1px solid var(--green-line); color: var(--green-ink);
  font-size: 11px;
}
.tag-top.new { background: #fde8c2; border-color: #e3bd72; color: #5a3a06; }
.tag-top.none { visibility: hidden; }
.name { margin: 6px 0 0; font-size: 19.5px; font-weight: 400; letter-spacing: -.2px; line-height: 1.1; }
.rate { margin-top: 5px; display: flex; align-items: center; gap: 3px; font-size: 11.5px; }
.rate svg { width: 13px; height: 13px; color: var(--star); }
.chips { margin-top: 9px; display: flex; flex-wrap: wrap; gap: 5px 3px; }
.chip {
  height: 21px; padding: 0 7px; display: inline-flex; align-items: center;
  border-radius: 11px; border: 1px solid var(--blue-line); background: var(--blue-soft); color: var(--blue);
  font-size: 10.6px; white-space: nowrap;
}
.was { margin-top: 12px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 0 5px; font-variant-numeric: tabular-nums; }
.was s { color: var(--strike); text-decoration-thickness: 1px; }
.was span { color: var(--red); }
.price { font-size: 23px; line-height: 1.1; letter-spacing: -.2px; font-variant-numeric: tabular-nums; }
.was.empty { visibility: hidden; }
.cmp { margin-top: 11px; display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; font-size: 13px; cursor: pointer; }
.cmp input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.box {
  width: 20px; height: 20px; border-radius: 4px; border: 1px solid var(--ink-2); background: var(--white);
  display: grid; place-items: center; transition: background .15s, border-color .15s;
}
.box svg { width: 13px; height: 13px; color: var(--white); opacity: 0; }
.cmp input:checked + .box { background: var(--navy); border-color: var(--navy); }
.cmp input:checked + .box svg { opacity: 1; }
.cmp input:focus-visible + .box { outline: 2px solid var(--blue); outline-offset: 2px; }
.cmp input:disabled + .box { opacity: .4; }

/* list view */
.grid.list { grid-template-columns: minmax(0, 1fr); }
.grid.list .card { flex-direction: row; gap: 4px; padding: 0 14px 0 0; }
.grid.list .media { width: 44%; flex: none; margin: 0; }
.grid.list .slides { border-radius: var(--r-card) 0 0 var(--r-card); height: 100%; }
.grid.list .slide { height: 100%; min-height: 220px; align-items: center; padding: 10px 0 18px 18px; }
.grid.list .dots { position: absolute; bottom: 10px; left: 0; right: 0; }
.grid.list .swatches { top: 50%; transform: translateY(-50%); right: 4px; }
.grid.list .info { flex: 1; padding: 0 0 16px 6px; }

/* ---------- promos ---------- */
.klarna {
  display: flex; align-items: center; gap: 16px;
  min-height: 64px; padding: 10px 16px 10px 14px;
  background: #ececef; border: 1px solid var(--white); border-radius: var(--r-card);
}
.klarna-logo {
  flex: none; width: 72px; height: 36px; border-radius: 4px; background: var(--klarna); color: var(--klarna-ink);
  display: grid; place-items: center; font-weight: 700; font-size: 17px; letter-spacing: -.3px;
}
.klarna p { margin: 0; font-size: 13.5px; }
.klarna a { display: inline-block; margin-top: 1px; font-size: 12.5px; color: var(--blue); }
.klarna a:hover { text-decoration: underline; }

.story {
  position: relative; overflow: hidden;
  height: 251px; border-radius: var(--r-card);
  background: var(--banner) center / cover no-repeat, #6f6a64;
  color: var(--white);
}
.story::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, .18)); pointer-events: none; }
.story .pop {
  position: absolute; top: 12px; left: 12px; z-index: 1;
  height: 32px; padding: 0 12px; display: inline-flex; align-items: center;
  border-radius: 16px; background: var(--popular); color: var(--navy); font-size: 13px;
}
.story .copy { position: absolute; left: 25px; right: 18px; bottom: 34px; z-index: 1; }
.story h2 { margin: 0; font-size: 24.5px; font-weight: 400; letter-spacing: -.2px; line-height: 1.1; text-wrap: balance; }
.story a { margin-top: 12px; display: inline-flex; align-items: center; gap: 7px; font-size: 14px; }
.story a svg { width: 16px; height: 16px; transition: transform .2s; }
.story a:hover svg { transform: translateX(3px); }

.empty-state { padding: 40px 16px; text-align: center; color: var(--ink-2); }
.empty-state button { margin-top: 12px; color: var(--blue); text-decoration: underline; }

/* ---------- floating delivery + compare ---------- */
.dock {
  position: fixed; z-index: 25; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.dock .wrap { display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
.dock .wrap > * { pointer-events: auto; }
.deliv {
  background: rgba(232, 233, 236, .92);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid var(--white); border-radius: var(--r-card);
  box-shadow: 0 8px 24px rgba(10, 35, 84, .1);
}
.deliv-head { width: 100%; display: flex; align-items: center; gap: 16px; padding: 15px 15px 15px 15px; text-align: left; }
.truck { flex: none; width: 32px; height: 32px; border-radius: 4px; background: var(--blue-soft); display: grid; place-items: center; }
.truck svg { width: 22px; height: 22px; }
.deliv-txt { flex: 1; min-width: 0; }
.deliv-txt b { display: block; font-weight: 400; font-size: 14px; }
.deliv-txt span { display: block; margin-top: 3px; font-size: 12.5px; color: var(--blue); }
.plus { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--plus); display: grid; place-items: center; transition: transform .25s; }
.plus svg { width: 16px; height: 16px; }
.deliv.open .plus { transform: rotate(45deg); }
.deliv-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.deliv.open .deliv-body { grid-template-rows: 1fr; }
.deliv-body > div { overflow: hidden; }
.deliv-body ul { list-style: none; margin: 0; padding: 0 16px 16px 63px; display: grid; gap: 10px; font-size: 13.5px; color: var(--ink-2); }
.deliv-body li b { color: var(--navy); font-weight: 500; }
.zip { display: flex; gap: 8px; margin-top: 2px; }
.zip input {
  flex: 1; min-width: 0; height: 34px; padding: 0 12px; border-radius: 17px;
  border: 1px solid #c9ccd4; background: var(--white); color: var(--navy); font: inherit; font-size: 14px;
}
.zip button { height: 34px; padding: 0 14px; border-radius: 17px; background: var(--navy); color: var(--white); font-size: 13.5px; }

.cmp-tray {
  display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px;
  background: var(--navy); color: var(--white); border-radius: 16px;
  box-shadow: 0 8px 24px rgba(10, 35, 84, .25);
  font-size: 14px;
}
.cmp-tray .thumbs { display: flex; gap: 4px; }
.cmp-tray .thumbs img { width: 26px; height: 34px; object-fit: contain; background: var(--card); border-radius: 5px; }
.cmp-tray .t { flex: 1; min-width: 0; }
.cmp-tray .go { height: 34px; padding: 0 14px; border-radius: 17px; background: var(--white); color: var(--navy); font-weight: 500; }
.cmp-tray .clr { opacity: .75; font-size: 13px; padding: 0 4px; }

/* ---------- sheets ---------- */
.veil { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; transition: opacity .25s; }
.veil.on { opacity: 1; }
.sheet {
  position: fixed; z-index: 41; left: 0; right: 0; bottom: 0;
  max-height: 86%; overflow-y: auto;
  background: var(--card); color: var(--navy);
  border-radius: 22px 22px 0 0;
  padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  transform: translateY(100%); transition: transform .3s cubic-bezier(.2, .8, .2, 1);
}
.sheet.on { transform: none; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: #c9ccd4; margin: 0 auto 14px; }
.sheet h3 { margin: 0 0 4px; font-size: 22px; font-weight: 400; }
.sheet .sub { color: var(--ink-2); font-size: 14px; margin: 0 0 16px; }
.sheet .x { position: absolute; top: 12px; right: max(14px, env(safe-area-inset-right, 0px)); width: 34px; height: 34px; border-radius: 50%; background: var(--tile); display: grid; place-items: center; }
.sheet .x svg { width: 16px; height: 16px; }
.qv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; align-items: start; }
.qv img { width: 120px; height: 180px; object-fit: contain; background: var(--white); border-radius: 14px; }
.qv .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.btn { height: 42px; padding: 0 18px; border-radius: 21px; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; }
.btn.pri { background: var(--navy); color: var(--white); }
.btn.sec { background: var(--white); border: 1px solid #c9ccd4; }
.btn.sec svg { width: 18px; height: 18px; }
.btn.sec.liked svg path { fill: var(--sale); stroke: var(--sale); }
.rows { display: grid; gap: 10px; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px; background: var(--white); border-radius: 14px; }
.row img { width: 44px; height: 60px; object-fit: contain; }
.row .t { flex: 1; min-width: 0; font-size: 14px; }
.row .t b { display: block; font-weight: 500; font-size: 15px; }
.row .rm { color: var(--blue); font-size: 13px; }
.sum { display: flex; justify-content: space-between; margin-top: 14px; font-size: 16px; }
.nav { list-style: none; padding: 0; margin: 8px 0 0; }
.nav a { display: flex; justify-content: space-between; padding: 14px 2px; border-bottom: 1px solid #dcdde2; font-size: 17px; }
.nav a.cur { font-weight: 600; }
.cmp-table { overflow-x: auto; }
.cmp-table table { border-collapse: collapse; font-size: 13.5px; min-width: 100%; }
.cmp-table th, .cmp-table td { text-align: left; padding: 9px 10px; border-bottom: 1px solid #dcdde2; vertical-align: top; white-space: nowrap; }
.cmp-table th { color: var(--ink-2); font-weight: 400; }
.cmp-table thead td { font-weight: 600; font-size: 15px; }

.toast {
  position: fixed; z-index: 50; left: 50%; top: calc(70px + env(safe-area-inset-top, 0px));
  transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
  background: var(--navy); color: var(--white); padding: 10px 16px; border-radius: 20px; font-size: 14px;
  transition: opacity .2s, transform .2s; white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.proto { text-align: center; font-size: 11.5px; color: var(--ink-2); margin: -84px 0 0; padding-bottom: 110px; }

/* ---------- mobile-only shell: same 430px column on every screen ---------- */
html { background: #f3f4f6; }
body { background: #f3f4f6; }
.app {
  position: relative; width: 100%; max-width: 430px; min-height: 100vh; margin: 0 auto;
  background: var(--page); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .25);
  overflow-x: clip;
}
.hdr.solid, .dock, .sheet, .toast-lane { max-width: 430px; margin-left: auto; margin-right: auto; }
.hdr.solid { left: 0; right: 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }

<div class="app">
<header class="hdr" id="hdr">
  <div class="wrap hdr-in">
    <div class="hdr-left">
      <button class="ibtn menu" id="menuBtn" aria-label="Open menu">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 6h20M3 13h20M3 20h20"/></svg>
      </button>
    </div>
    <a href="#top" class="logo" aria-label="Electrolux home"></a>
    <div class="hdr-right">
      <button class="ibtn" id="likeBtn" aria-label="Saved items">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M13 22.2 4.3 13.6a5.4 5.4 0 0 1 0-7.7 5.3 5.3 0 0 1 7.6 0L13 7l1.1-1.1a5.3 5.3 0 0 1 7.6 0 5.4 5.4 0 0 1 0 7.7Z"/></svg>
        <span class="badge-count" id="likeCount">0</span>
      </button>
      <button class="ibtn bag" id="bagBtn" aria-label="Shopping bag">
        <svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4.5 9h17l-1 14h-15Z"/><path d="M9 11V6.5a4 4 0 0 1 8 0V11" stroke-linecap="round"/></svg>
        <span class="badge-count" id="bagCount">0</span>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero">
    <div class="wrap"><h1>Air<br>purifiers</h1></div>
  </section>

  <div class="wrap">
    <div class="pills" id="pills" role="group" aria-label="Filters">
      <button class="pill sale" data-f="sale" aria-pressed="true">9.9 Sale</button>
      <button class="pill" data-f="quick" aria-pressed="false">Quick delivery</button>
      <button class="pill" data-f="allergy" aria-pressed="false">Allergy cerfied</button>
      <button class="pill" data-f="large" aria-pressed="false">Large rooms</button>
      <button class="pill" data-f="pets" aria-pressed="false">Pet owners</button>
      <button class="pill" data-f="quiet" aria-pressed="false">Quiet night mode</button>
    </div>

    <div class="bar">
      <div class="count" id="count" aria-live="polite">16 items</div>
      <span class="sort-lbl">Sort by:</span>
      <div class="sort" id="sort">
        <button class="sort-btn" id="sortBtn" aria-haspopup="menu" aria-expanded="false">
          <span id="sortLabel">Best sellers</span>
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 5 4.5 4.5L11.5 5"/></svg>
        </button>
        <ul class="sort-menu" id="sortMenu" role="menu" hidden></ul>
      </div>
      <button class="view-btn" id="viewBtn" aria-label="Show as list" aria-pressed="false"></button>
    </div>

    <div class="grid" id="grid"></div>
  </div>
  <p class="proto">Design prototype · not a live store</p>
</main>

<div class="dock">
  <div class="wrap">
    <div class="cmp-tray" id="tray" hidden>
      <div class="thumbs" id="trayThumbs"></div>
      <div class="t" id="trayTxt">1 of 4 selected</div>
      <button class="clr" id="trayClear">Clear</button>
      <button class="go" id="trayGo">Compare</button>
    </div>
    <div class="deliv" id="deliv">
      <button class="deliv-head" id="delivBtn" aria-expanded="false" aria-controls="delivBody">
        <span class="truck"><svg viewBox="0 0 24 24" fill="none" stroke="#0a2354" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 6.5h11v10h-11z"/><path d="M13.5 9.5h4l3 3.5v3.5h-7"/><circle cx="6.5" cy="17" r="1.8" fill="#e9f6ff"/><circle cx="17" cy="17" r="1.8" fill="#e9f6ff"/></svg></span>
        <span class="deliv-txt"><b>Buy today and get fast delivery</b><span id="eta">Estimate delivered date: 10th Oct</span></span>
        <span class="plus"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg></span>
      </button>
      <div class="deliv-body" id="delivBody"><div>
        <ul>
          <li><b>Free delivery</b> on orders over B 3000, Bangkok and nearby provinces.</li>
          <li><b>Order before 14:00</b> for next-day dispatch on Quick delivery items.</li>
          <li>
            <form class="zip" id="zipForm">
              <label for="zip" class="sr" hidden>Postcode</label>
              <input id="zip" inputmode="numeric" maxlength="5" placeholder="Enter postcode">
              <button type="submit">Check</button>
            </form>
          </li>
        </ul>
      </div></div>
    </div>
  </div>
</div>

<div class="veil" id="veil" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab"></div>
  <button class="x" id="sheetX" aria-label="Close"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m3 3 10 10M13 3 3 13"/></svg></button>
  <div id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

const $ = s => document.querySelector(s);
const grid = $("#grid");

// Price formats copied from the screenshot: "B 8100", "B 10 100", "B3,043"
const fmtPrice = n => "B " + (n >= 10000 ? String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ") : n);
const fmtSave = n => "B" + n.toLocaleString("en-US");

const ICON = {
  star: '<svg viewBox="0 0 14 14"><path fill="currentColor" d="m7 1 1.8 3.9 4.2.4-3.2 2.8.9 4.1L7 10.1 3.3 12.2l.9-4.1L1 5.3l4.2-.4Z"/></svg>',
  tick: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7.3 2.6 2.6L11 4.5"/></svg>',
  list: '<svg viewBox="0 0 20 20" fill="none" stroke="#0a2354" stroke-width="1.5"><rect x="2.5" y="4" width="15" height="12" rx="2"/><path d="M2.5 10h15"/></svg>',
  grid: '<svg viewBox="0 0 20 20" fill="none" stroke="#0a2354" stroke-width="1.5"><rect x="2.5" y="2.5" width="6.2" height="6.2" rx="1.4"/><rect x="11.3" y="2.5" width="6.2" height="6.2" rx="1.4"/><rect x="2.5" y="11.3" width="6.2" height="6.2" rx="1.4"/><rect x="11.3" y="11.3" width="6.2" height="6.2" rx="1.4"/></svg>',
  arrow: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h12M9.5 3.5 14 8l-4.5 4.5"/></svg>',
  heart: '<svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 22.2 4.3 13.6a5.4 5.4 0 0 1 0-7.7 5.3 5.3 0 0 1 7.6 0L13 7l1.1-1.1a5.3 5.3 0 0 1 7.6 0 5.4 5.4 0 0 1 0 7.7Z"/></svg>',
};

function cols() { return S.view === "list" ? 1 : 2; }

function visible() {
  const sorter = SORTS.find(s => s[0] === S.sort)[2];
  return P.filter(p => [...S.filters].every(f => p[f])).sort(sorter);
}

function cardHTML(p) {
  const slides = ["", "flip", "zoom"].map(c => `<div class="slide ${c}"><img alt="${p.name}, ${COLORS[p.color].label}" src="${IMG[p.color]}" loading="lazy"></div>`).join("");
  const sw = p.colors.map(c => `<button class="sw" role="radio" aria-checked="${c === p.color}" aria-label="${COLORS[c].label}" data-color="${c}" style="--c:${COLORS[c].c}"></button>`).join("");
  const topCls = !p.top ? "none" : p.top === "New" ? "new" : "";
  const save = p.save ?? (p.was ? p.was - p.price : 0);
  const was = p.sale && p.was ? `<s>${fmtPrice(p.was)}</s><span>Save&nbsp; ${fmtSave(save)}</span>` : `<s>&nbsp;</s>`;
  const full = S.compare.size >= 4 && !S.compare.has(p.id);
  return `<article class="card" data-id="${p.id}">
    <div class="media">
      <div class="slides">${slides}</div>
      <div class="swatches" role="radiogroup" aria-label="Colour">${sw}</div>
      <div class="dots">${[0, 1, 2].map(i => `<button class="dot${i === p.slide ? " on" : ""}" data-i="${i}" aria-label="Image ${i + 1}"></button>`).join("")}</div>
    </div>
    <div class="info">
      <span class="tag-top ${topCls}">${p.top || "&nbsp;"}</span>
      <h3 class="name">${p.name}</h3>
      <div class="rate">${ICON.star}<span>${p.rating} (${p.reviews})</span></div>
      <div class="chips">${p.tags.map(t => `<span class="chip">${t}</span>`).join("")}</div>
      <div class="was${p.sale && p.was ? "" : " empty"}">${was}</div>
      <div class="price">${fmtPrice(p.price)}</div>
      <label class="cmp"><input type="checkbox" id="cmp-${p.id}" ${S.compare.has(p.id) ? "checked" : ""} ${full ? "disabled" : ""}><span class="box">${ICON.tick}</span>Compare</label>
    </div>
  </article>`;
}

const PROMO = `<div class="span promo-pair">
  <div class="klarna">
    <div class="klarna-logo">Klarna</div>
    <div><p>0% installment for 6 months</p><a href="#" data-act="klarna">Find out more</a></div>
  </div>
  <div class="story">
    <span class="pop">Popular choice</span>
    <div class="copy"><h2>Breathe better, live better.</h2><a href="#" data-act="story">${ICON.arrow}Discover more</a></div>
  </div>
</div>`;

function render() {
  const items = visible();
  $("#count").textContent = items.length + (items.length === 1 ? " item" : " items");
  grid.classList.toggle("list", S.view === "list");
  if (!items.length) {
    grid.innerHTML = `<div class="span empty-state">No air purifiers match all of these filters.<br><button data-act="reset">Clear filters</button></div>`;
    return;
  }
  const n = cols();
  let html = "";
  items.forEach((p, i) => {
    if (i === n) html += PROMO;
    html += cardHTML(p);
  });
  if (items.length <= n) html += PROMO;
  grid.innerHTML = html;
  grid.querySelectorAll(".card").forEach(c => {
    const p = P[+c.dataset.id];
    const sl = c.querySelector(".slides");
    if (p.slide) requestAnimationFrame(() => { sl.scrollLeft = p.slide * sl.clientWidth; });
    sl.addEventListener("scroll", () => {
      const i = Math.round(sl.scrollLeft / sl.clientWidth);
      if (i !== p.slide) { p.slide = i; c.querySelectorAll(".dot").forEach((d, k) => d.classList.toggle("on", k === i)); }
    }, { passive: true });
  });
}

/* ---- pills ---- */
$("#pills").addEventListener("click", e => {
  const b = e.target.closest(".pill"); if (!b) return;
  const f = b.dataset.f, on = b.getAttribute("aria-pressed") !== "true";
  b.setAttribute("aria-pressed", on);
  on ? S.filters.add(f) : S.filters.delete(f);
  render();
});

/* ---- sort ---- */
const sortMenu = $("#sortMenu"), sortBox = $("#sort"), sortBtn = $("#sortBtn");
sortMenu.innerHTML = SORTS.map(([k, l]) => `<li><button role="menuitemradio" data-k="${k}" aria-checked="${k === S.sort}">${l}</button></li>`).join("");
function toggleSort(open) {
  sortMenu.hidden = !open; sortBox.classList.toggle("open", open); sortBtn.setAttribute("aria-expanded", open);
}
sortBtn.addEventListener("click", e => { e.stopPropagation(); toggleSort(sortMenu.hidden); });
sortMenu.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  S.sort = b.dataset.k;
  sortMenu.querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", x === b));
  $("#sortLabel").textContent = b.textContent;
  toggleSort(false); render();
});
document.addEventListener("click", e => { if (!sortBox.contains(e.target)) toggleSort(false); });

/* ---- view toggle ---- */
const viewBtn = $("#viewBtn");
function paintView() {
  viewBtn.innerHTML = S.view === "grid" ? ICON.list : ICON.grid;
  viewBtn.setAttribute("aria-label", S.view === "grid" ? "Show as list" : "Show as grid");
  viewBtn.setAttribute("aria-pressed", S.view === "list");
}
viewBtn.addEventListener("click", () => { S.view = S.view === "grid" ? "list" : "grid"; paintView(); render(); });
paintView();

/* ---- card interactions ---- */
grid.addEventListener("click", e => {
  const act = e.target.closest("[data-act]");
  if (act) {
    e.preventDefault();
    if (act.dataset.act === "reset") { S.filters.clear(); document.querySelectorAll(".pill").forEach(p => p.setAttribute("aria-pressed", "false")); render(); }
    if (act.dataset.act === "klarna") openSheet("klarna");
    if (act.dataset.act === "story") { S.sort = "best"; toast("Showing our most popular purifiers"); scrollTo({ top: grid.offsetTop - 80, behavior: "smooth" }); }
    return;
  }
  const card = e.target.closest(".card"); if (!card) return;
  const p = P[+card.dataset.id];
  const sw = e.target.closest(".sw");
  if (sw) {
    p.color = sw.dataset.color;
    card.querySelectorAll(".sw").forEach(x => x.setAttribute("aria-checked", x === sw));
    card.querySelectorAll(".slide img").forEach(img => { img.style.opacity = 0; setTimeout(() => { img.src = IMG[p.color]; img.alt = `${p.name}, ${COLORS[p.color].label}`; img.style.opacity = 1; }, 120); });
    return;
  }
  const dot = e.target.closest(".dot");
  if (dot) { const sl = card.querySelector(".slides"); sl.scrollTo({ left: +dot.dataset.i * sl.clientWidth, behavior: "smooth" }); return; }
  if (e.target.closest(".cmp")) return;
  openSheet("product", p);
});
grid.addEventListener("change", e => {
  if (!e.target.matches(".cmp input")) return;
  const id = +e.target.closest(".card").dataset.id;
  e.target.checked ? S.compare.add(id) : S.compare.delete(id);
  syncCompare();
});
function syncCompare() {
  const n = S.compare.size;
  grid.querySelectorAll(".card").forEach(c => {
    const i = c.querySelector(".cmp input"), id = +c.dataset.id;
    i.checked = S.compare.has(id); i.disabled = n >= 4 && !S.compare.has(id);
  });
  $("#tray").hidden = n === 0;
  $("#trayTxt").textContent = n === 1 ? "Pick 1 more to compare" : `${n} of 4 selected`;
  $("#trayThumbs").innerHTML = [...S.compare].map(id => `<img alt="" src="${IMG[P[id].color]}">`).join("");
  $("#trayGo").disabled = n < 2; $("#trayGo").style.opacity = n < 2 ? .5 : 1;
}
$("#trayClear").addEventListener("click", () => { S.compare.clear(); syncCompare(); });
$("#trayGo").addEventListener("click", () => openSheet("compare"));

/* ---- delivery bar ---- */
const deliv = $("#deliv");
$("#delivBtn").addEventListener("click", () => {
  const open = !deliv.classList.contains("open");
  deliv.classList.toggle("open", open); $("#delivBtn").setAttribute("aria-expanded", open);
});
$("#zipForm").addEventListener("submit", e => {
  e.preventDefault();
  const z = $("#zip").value.trim();
  if (!/^\d{5}$/.test(z)) { toast("Enter a 5-digit postcode"); return; }
  const day = z.startsWith("10") ? "9th Oct" : "11th Oct";
  $("#eta").textContent = `Estimate delivered date: ${day} · ${z}`;
  toast(`Delivery to ${z} by ${day}`);
});

/* ---- header ---- */
const hdr = $("#hdr"), hero = $("#hero");
function onScroll() { hdr.classList.toggle("solid", scrollY > hero.offsetHeight - 70); }
addEventListener("scroll", onScroll, { passive: true });
let lastCols = cols();
addEventListener("resize", () => { const c = cols(); if (c !== lastCols) { lastCols = c; render(); } });
$("#likeBtn").addEventListener("click", () => openSheet("liked"));
$("#bagBtn").addEventListener("click", () => openSheet("bag"));
$("#menuBtn").addEventListener("click", () => openSheet("menu"));

function bumpCounts() {
  const lc = $("#likeCount"), bc = $("#bagCount");
  lc.textContent = S.liked.size; lc.classList.toggle("on", S.liked.size > 0);
  bc.textContent = S.bag.length; bc.classList.toggle("on", S.bag.length > 0);
  $("#likeBtn").classList.toggle("liked", S.liked.size > 0);
}
function bump(el) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }

/* ---- sheets ---- */
const sheet = $("#sheet"), veil = $("#veil"), body = $("#sheetBody");
let sheetCtx = null;
function openSheet(kind, p) {
  sheetCtx = { kind, p };
  paintSheet();
  sheet.hidden = veil.hidden = false;
  requestAnimationFrame(() => { sheet.classList.add("on"); veil.classList.add("on"); });
  document.body.style.overflow = "hidden";
}
function closeSheet() {
  sheet.classList.remove("on"); veil.classList.remove("on");
  setTimeout(() => { sheet.hidden = veil.hidden = true; }, 300);
  document.body.style.overflow = "";
}
veil.addEventListener("click", closeSheet);
$("#sheetX").addEventListener("click", closeSheet);
addEventListener("keydown", e => { if (e.key === "Escape") { closeSheet(); toggleSort(false); } });

function row(p, extra) {
  return `<div class="row"><img alt="" src="${IMG[p.color]}"><div class="t"><b>${p.name}</b>${COLORS[p.color].label} · ${fmtPrice(p.price)}</div>${extra}</div>`;
}
function paintSheet() {
  const { kind, p } = sheetCtx;
  if (kind === "product") {
    const liked = S.liked.has(p.id);
    body.innerHTML = `<h3 id="sheetTitle">${p.name}</h3><p class="sub">${p.room} · CADR ${p.cadr} · ${p.noise}</p>
      <div class="qv"><img alt="${p.name}" src="${IMG[p.color]}"><div>
        <div class="rate">${ICON.star}<span>${p.rating} (${p.reviews} reviews)</span></div>
        <div class="chips">${p.tags.map(t => `<span class="chip">${t}</span>`).join("")}</div>
        ${p.sale && p.was ? `<div class="was"><s>${fmtPrice(p.was)}</s><span>Save&nbsp; ${fmtSave(p.save ?? p.was - p.price)}</span></div>` : ""}
        <div class="price">${fmtPrice(p.price)}</div>
        <div class="actions">
          <button class="btn pri" data-s="add">Add to bag</button>
          <button class="btn sec${liked ? " liked" : ""}" data-s="like" aria-pressed="${liked}">${ICON.heart}${liked ? "Saved" : "Save"}</button>
        </div>
      </div></div>`;
  } else if (kind === "bag") {
    const total = S.bag.reduce((s, id) => s + P[id].price, 0);
    body.innerHTML = `<h3 id="sheetTitle">Your bag</h3>` + (S.bag.length
      ? `<p class="sub">${S.bag.length} item${S.bag.length > 1 ? "s" : ""}</p><div class="rows">${S.bag.map((id, i) => row(P[id], `<button class="rm" data-s="rmbag" data-i="${i}">Remove</button>`)).join("")}</div><div class="sum"><span>Total</span><b>${fmtPrice(total)}</b></div>`
      : `<p class="sub">Your bag is empty. Tap a product, then choose Add to bag.</p>`);
  } else if (kind === "liked") {
    body.innerHTML = `<h3 id="sheetTitle">Saved items</h3>` + (S.liked.size
      ? `<div class="rows">${[...S.liked].map(id => row(P[id], `<button class="rm" data-s="unlike" data-id="${id}">Remove</button>`)).join("")}</div>`
      : `<p class="sub">Nothing saved yet. Tap a product, then choose Save.</p>`);
  } else if (kind === "menu") {
    body.innerHTML = `<h3 id="sheetTitle">Shop</h3><ul class="nav">${["Air purifiers", "Vacuum cleaners", "Washing machines", "Refrigerators", "Ovens & hobs", "Accessories & filters", "Support"].map((x, i) => `<li><a href="#" class="${i ? "" : "cur"}" data-s="nav">${x}<span>›</span></a></li>`).join("")}</ul>`;
  } else if (kind === "klarna") {
    body.innerHTML = `<h3 id="sheetTitle">Pay in 6 with Klarna</h3><p class="sub">Split any order over B 3000 into 6 monthly payments with 0% interest. For the Pure A9 at B 8100, that is B 1350 a month.</p><button class="btn pri" data-s="close">Got it</button>`;
  } else if (kind === "compare") {
    const ps = [...S.compare].map(id => P[id]);
    const r = (label, f) => `<tr><th>${label}</th>${ps.map(p => `<td>${f(p)}</td>`).join("")}</tr>`;
    body.innerHTML = `<h3 id="sheetTitle">Compare</h3><p class="sub">${ps.length} air purifiers side by side</p><div class="cmp-table"><table>
      <thead><tr><th></th>${ps.map(p => `<td>${p.name}</td>`).join("")}</tr></thead>
      <tbody>${r("Price", p => fmtPrice(p.price))}${r("Room size", p => p.room)}${r("Clean air rate", p => p.cadr)}${r("Night noise", p => p.noise)}${r("Rating", p => `${p.rating} (${p.reviews})`)}${r("Allergy certified", p => p.allergy ? "Yes" : "No")}</tbody></table></div>`;
  }
}
body.addEventListener("click", e => {
  const b = e.target.closest("[data-s]"); if (!b) return;
  e.preventDefault();
  const { p } = sheetCtx, s = b.dataset.s;
  if (s === "add") { S.bag.push(p.id); bumpCounts(); bump($("#bagBtn")); toast(`${p.name} added to bag`); closeSheet(); }
  if (s === "like") { S.liked.has(p.id) ? S.liked.delete(p.id) : S.liked.add(p.id); bumpCounts(); bump($("#likeBtn")); paintSheet(); }
  if (s === "rmbag") { S.bag.splice(+b.dataset.i, 1); bumpCounts(); paintSheet(); }
  if (s === "unlike") { S.liked.delete(+b.dataset.id); bumpCounts(); paintSheet(); }
  if (s === "nav" || s === "close") closeSheet();
});

let tt;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200);
}

render(); onScroll(); bumpCounts();
</script>

</body>
</html>
